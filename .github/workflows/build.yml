name: Build Windows EXE

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Find OpenEXR paths
        id: openexr
        shell: python
        run: |
          import site, pathlib, glob, os
          sp = pathlib.Path(site.getsitepackages()[0])
          imath = sp / 'Imath.py'
          openexr = glob.glob(str(sp / 'OpenEXR.*.pyd'))
          found_imath = imath.exists()
          found_openexr = bool(openexr)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'IMATH={imath if found_imath else ""}\n')
              f.write(f'OPENEXR={openexr[0] if found_openexr else ""}\n')
          print(f'Imath: {imath} (exists={found_imath})')
          print(f'OpenEXR: {openexr[0] if found_openexr else "NOT FOUND"}')

      - name: Build EXE
        shell: bash
        run: |
          ARGS=(
            --onefile
            --windowed
            --name "MazeHub"
            --icon "MazeHub_Logo.ico"
            --add-data ".pipeline_mirror/pipeline;pipeline"
            --add-data "make_folders.py;."
            --collect-all PySide6
            --collect-all numpy
            --collect-all PIL
            --hidden-import pipeline_gui
            --hidden-import pipeline_app
            --hidden-import recent_files
            --hidden-import settings
            --hidden-import OpenEXR
            --hidden-import Imath
            --hidden-import numpy
          )
          if [ -n "${{ steps.openexr.outputs.IMATH }}" ]; then
            ARGS+=(--add-data "${{ steps.openexr.outputs.IMATH }};.")
          fi
          if [ -n "${{ steps.openexr.outputs.OPENEXR }}" ]; then
            ARGS+=(--add-binary "${{ steps.openexr.outputs.OPENEXR }};.")
          fi
          python -m PyInstaller "${ARGS[@]}" main.py

      - name: Publish pipeline
        run: python publish_pipeline.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MazeHub-windows
          path: dist/MazeHub.exe

      - name: Upload published bundle
        uses: actions/upload-artifact@v4
        with:
          name: MazeHub-pipeline
          path: publish/
