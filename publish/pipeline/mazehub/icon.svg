<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00c853"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bg)" stroke="#2a2a2a" stroke-width="4"/>

  <!-- Ears -->
  <polygon points="160,160 130,80 190,140" fill="#2a2a2a" stroke="#00c853" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="352,160 382,80 322,140" fill="#2a2a2a" stroke="#00c853" stroke-width="3" stroke-linejoin="round"/>

  <!-- Ear tufts -->
  <line x1="130" y1="80" x2="120" y2="50" stroke="#00c853" stroke-width="4" stroke-linecap="round"/>
  <line x1="130" y1="80" x2="140" y2="45" stroke="#00c853" stroke-width="4" stroke-linecap="round"/>
  <line x1="382" y1="80" x2="372" y2="50" stroke="#00c853" stroke-width="4" stroke-linecap="round"/>
  <line x1="382" y1="80" x2="392" y2="45" stroke="#00c853" stroke-width="4" stroke-linecap="round"/>

  <!-- Head -->
  <ellipse cx="256" cy="260" rx="120" ry="110" fill="#2a2a2a" stroke="#3a3a3a" stroke-width="2"/>

  <!-- Cheek fur left -->
  <polygon points="136,260 100,280 136,290 105,310 140,310" fill="#333333"/>
  <!-- Cheek fur right -->
  <polygon points="376,260 412,280 376,290 407,310 372,310" fill="#333333"/>

  <!-- Eyes -->
  <ellipse cx="210" cy="240" rx="28" ry="24" fill="#111111"/>
  <ellipse cx="302" cy="240" rx="28" ry="24" fill="#111111"/>
  <ellipse cx="210" cy="240" rx="16" ry="18" fill="url(#accent)"/>
  <ellipse cx="302" cy="240" rx="16" ry="18" fill="url(#accent)"/>
  <ellipse cx="210" cy="240" rx="7" ry="12" fill="#000000"/>
  <ellipse cx="302" cy="240" rx="7" ry="12" fill="#000000"/>
  <!-- Eye highlights -->
  <ellipse cx="216" cy="233" rx="4" ry="4" fill="#ffffff" opacity="0.6"/>
  <ellipse cx="308" cy="233" rx="4" ry="4" fill="#ffffff" opacity="0.6"/>

  <!-- Nose -->
  <polygon points="256,280 248,295 264,295" fill="#444444"/>
  <polygon points="256,280 248,295 264,295" fill="url(#accent)" opacity="0.5"/>

  <!-- Mouth -->
  <path d="M256,295 Q240,315 228,305" fill="none" stroke="#444444" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M256,295 Q272,315 284,305" fill="none" stroke="#444444" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Whiskers left -->
  <line x1="180" y1="280" x2="90" y2="270" stroke="#555555" stroke-width="2" stroke-linecap="round"/>
  <line x1="180" y1="290" x2="85" y2="295" stroke="#555555" stroke-width="2" stroke-linecap="round"/>
  <line x1="180" y1="300" x2="95" y2="320" stroke="#555555" stroke-width="2" stroke-linecap="round"/>

  <!-- Whiskers right -->
  <line x1="332" y1="280" x2="422" y2="270" stroke="#555555" stroke-width="2" stroke-linecap="round"/>
  <line x1="332" y1="290" x2="427" y2="295" stroke="#555555" stroke-width="2" stroke-linecap="round"/>
  <line x1="332" y1="300" x2="417" y2="320" stroke="#555555" stroke-width="2" stroke-linecap="round"/>

  <!-- Inner ear pink -->
  <polygon points="155,155 140,100 180,145" fill="#3d1a1a" opacity="0.6"/>
  <polygon points="357,155 372,100 332,145" fill="#3d1a1a" opacity="0.6"/>
</svg>
